services:
  mysql:
    image: mysql:8.4
    container_name: popq-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${POPQ_DB_NAME:-popq}
      MYSQL_USER: ${POPQ_DB_USERNAME:-popq}
      MYSQL_PASSWORD: ${POPQ_DB_PASSWORD:?POPQ_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${POPQ_DB_ROOT_PASSWORD:?POPQ_DB_ROOT_PASSWORD is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${POPQ_DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - popq_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend_spring/Dockerfile
    container_name: popq-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${POPQ_SPRING_PROFILES_ACTIVE:-dev}
      POPQ_SERVER_PORT: 8082
      POPQ_DB_URL: jdbc:mysql://mysql:3306/${POPQ_DB_NAME:-popq}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      POPQ_DB_USERNAME: ${POPQ_DB_USERNAME:-popq}
      POPQ_DB_PASSWORD: ${POPQ_DB_PASSWORD:?POPQ_DB_PASSWORD is required}
      POPQ_JWT_ISSUER: ${POPQ_JWT_ISSUER:-popq}
      POPQ_JWT_SECRET: ${POPQ_JWT_SECRET:?POPQ_JWT_SECRET is required}
      POPQ_ACCESS_TOKEN_EXPIRATION: ${POPQ_ACCESS_TOKEN_EXPIRATION:-PT1H}
      POPQ_DEV_LOGIN_ENABLED: ${POPQ_DEV_LOGIN_ENABLED:-false}
      POPQ_GOOGLE_CLIENT_ID: ${POPQ_GOOGLE_CLIENT_ID:-}
      POPQ_KAKAO_REST_API_KEY: ${POPQ_KAKAO_REST_API_KEY:-}
      POPQ_KAKAO_CLIENT_SECRET: ${POPQ_KAKAO_CLIENT_SECRET:-}
      POPQ_KAKAO_SELLER_REDIRECT_URI: ${POPQ_KAKAO_SELLER_REDIRECT_URI:-}
      POPQ_KAKAO_CUSTOMER_APP_ID: ${POPQ_KAKAO_CUSTOMER_APP_ID:-0}
      POPQ_KAKAO_SELLER_APP_ID: ${POPQ_KAKAO_SELLER_APP_ID:-0}
      POPQ_NAVER_CLIENT_ID: ${POPQ_NAVER_CLIENT_ID:-}
      POPQ_NAVER_CLIENT_SECRET: ${POPQ_NAVER_CLIENT_SECRET:-}
      POPQ_NAVER_SELLER_REDIRECT_URI: ${POPQ_NAVER_SELLER_REDIRECT_URI:-}
      POPQ_SEED_ENABLED: ${POPQ_SEED_ENABLED:-true}
      POPQ_UPLOAD_PATH: /app/uploads
      POPQ_QR_PUBLIC_BASE_URL: ${POPQ_QR_PUBLIC_BASE_URL:-http://localhost:5173}
      POPQ_QR_TOKEN_ENCRYPTION_KEY: ${POPQ_QR_TOKEN_ENCRYPTION_KEY:-${POPQ_JWT_SECRET}}
      POPQ_GUEST_SESSION_TTL: ${POPQ_GUEST_SESSION_TTL:-PT12H}
      POPQ_COOKIE_SECURE: ${POPQ_COOKIE_SECURE:-false}
      POPQ_ORDER_PAYMENT_DEADLINE: ${POPQ_ORDER_PAYMENT_DEADLINE:-PT15M}
      POPQ_PAYMENT_PROVIDER: ${POPQ_PAYMENT_PROVIDER:-TEST}
      POPQ_TOSS_SECRET_KEY: ${POPQ_TOSS_SECRET_KEY:-}
      POPQ_FIREBASE_ENABLED: ${POPQ_FIREBASE_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      POPQ_REALTIME_ALLOWED_ORIGINS: ${POPQ_REALTIME_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5183,http://localhost:5184,http://10.0.2.2:5173}
      POPQ_WEB_ALLOWED_ORIGINS: ${POPQ_WEB_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5183,http://localhost:5184,http://10.0.2.2:5173}
      TZ: UTC
    ports:
      - "${POPQ_SERVER_PORT:-8082}:8082"
    volumes:
      - popq_uploads:/app/uploads
      - "${GOOGLE_APPLICATION_CREDENTIALS:-C:/workspace/popq-36fd0-firebase-adminsdk-fbsvc-d8b380e7c6.json}:/run/secrets/firebase-admin.json:ro"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8082/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  qr-web:
    build:
      context: .
      dockerfile: web_react/popq/Dockerfile
      args:
        VITE_POPQ_TOSS_CLIENT_KEY: ${POPQ_TOSS_CLIENT_KEY:-}
    container_name: popq-qr-web
    restart: unless-stopped
    ports:
      - "${POPQ_QR_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  seller-web:
    build:
      context: .
      dockerfile: web_react/seller-web/Dockerfile
    container_name: popq-seller-web
    restart: unless-stopped
    ports:
      - "${POPQ_SELLER_WEB_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  popq_mysql_data:
  popq_uploads:
