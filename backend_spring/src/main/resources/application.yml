spring:
  application:
    name: popq

  datasource:
    url: ${POPQ_DB_URL:jdbc:mysql://localhost:3307/popq?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${POPQ_DB_USERNAME:popq}
    password: ${POPQ_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      location: ${POPQ_UPLOAD_TEMP:${java.io.tmpdir}}
      max-request-size: 30MB
      max-file-size: 10MB

server:
  port: ${POPQ_SERVER_PORT:8082}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

popq:
  upload:
    path: ${POPQ_UPLOAD_PATH:./uploads}

  kakao:
    rest-api-base-url: ${POPQ_KAKAO_REST_API_BASE_URL:https://dapi.kakao.com}
    rest-api-key: ${POPQ_KAKAO_REST_API_KEY:}

  security:
    jwt:
      issuer: ${POPQ_JWT_ISSUER:popq}
      secret: ${POPQ_JWT_SECRET}
      access-token-expiration: ${POPQ_ACCESS_TOKEN_EXPIRATION:PT1H}

  auth:
    dev-login-enabled: ${POPQ_DEV_LOGIN_ENABLED:false}

  social:
    google:
      client-id: ${POPQ_GOOGLE_CLIENT_ID}
    kakao:
      api-base-url: ${POPQ_KAKAO_API_BASE_URL:https://kapi.kakao.com}
      customer-app-id: ${POPQ_KAKAO_CUSTOMER_APP_ID}
      seller-app-id: ${POPQ_KAKAO_SELLER_APP_ID}
    naver:
      api-base-url: ${POPQ_NAVER_API_BASE_URL:https://openapi.naver.com}

  qr:
    public-base-url: ${POPQ_QR_PUBLIC_BASE_URL:http://localhost:5173}
    guest-session-ttl: ${POPQ_GUEST_SESSION_TTL:PT12H}
    cookie-secure: ${POPQ_COOKIE_SECURE:true}

  order:
    payment-deadline: ${POPQ_ORDER_PAYMENT_DEADLINE:PT15M}

  payment:
    provider: ${POPQ_PAYMENT_PROVIDER:TEST}
    toss:
      api-base-url: https://api.tosspayments.com
      secret-key: ${POPQ_TOSS_SECRET_KEY:}

  realtime:
    allowed-origin-patterns: ${POPQ_REALTIME_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5183,http://localhost:5184,http://10.0.2.2:5173}

  web:
    allowed-origin-patterns: ${POPQ_WEB_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5183,http://localhost:5184,http://10.0.2.2:5173}
