spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

popq:
  auth:
    dev-login-enabled: true

  qr:
    cookie-secure: false

  seed:
    enabled: true

  push:
    firebase-enabled: ${POPQ_FIREBASE_ENABLED:false}

  admin-seed:
    enabled: ${POPQ_ADMIN_SEED_ENABLED:false}
    email: ${POPQ_ADMIN_EMAIL:}
    password: ${POPQ_ADMIN_PASSWORD:}
    name: ${POPQ_ADMIN_NAME:POPQ 관리자}