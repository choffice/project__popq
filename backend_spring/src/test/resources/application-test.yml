spring:
  datasource:
    url: jdbc:tc:mysql:8.0.36:///popq_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    mail:
      enabled: false

popq:
  auth:
    dev-login-enabled: true
    email-verification:
      required: false

  security:
    jwt:
      issuer: popq-test
      secret: popq-test-secret-must-be-at-least-32-bytes-long
      access-token-expiration: PT15M

  qr:
    public-base-url: https://order.popq.test
    guest-session-ttl: PT1H
    cookie-secure: false
    token-encryption-key: popq-test-qr-token-encryption-key-at-least-32-bytes